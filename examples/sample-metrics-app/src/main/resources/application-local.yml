# In-memory H2 для spring-boot:run (профиль local из application.yml).
spring:
  config:
    activate:
      on-profile: local

# Значения Hikari — миллисекунды (long), не Duration.
app:
  metrics-datasources:
    business:
      url: jdbc:h2:mem:sample-metrics;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DATABASE_TO_LOWER=TRUE
      driver-class-name: org.h2.Driver
      username: sa
      password:
      hikari:
        pool-name: business-metrics-pool
        maximum-pool-size: 3
        minimum-idle: 0
        connection-timeout: 10000           # 10 с
        idle-timeout: 300000                # 5 мин
        max-lifetime: 1800000               # 30 мин
        keepalive-time: 60000               # 1 мин
        leak-detection-threshold: 60000     # 1 мин
        read-only: true
        auto-commit: true
    workflow:
      url: jdbc:h2:mem:sample-metrics;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DATABASE_TO_LOWER=TRUE
      driver-class-name: org.h2.Driver
      username: sa
      password:
      hikari:
        pool-name: workflow-metrics-pool
        maximum-pool-size: 3
        minimum-idle: 0
        connection-timeout: 10000           # 10 с
        idle-timeout: 300000                # 5 мин
        max-lifetime: 1800000               # 30 мин
        keepalive-time: 60000               # 1 мин
        leak-detection-threshold: 60000     # 1 мин
        read-only: true
        auto-commit: true
    telemetry:
      url: jdbc:h2:mem:sample-metrics;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DATABASE_TO_LOWER=TRUE
      driver-class-name: org.h2.Driver
      username: sa
      password:
      hikari:
        pool-name: telemetry-pool
        maximum-pool-size: 2
        minimum-idle: 0
        connection-timeout: 5000            # 5 с
        idle-timeout: 300000                # 5 мин
        max-lifetime: 1800000               # 30 мин
        read-only: false
        auto-commit: true
