spring:
  config:
    activate:
      on-profile: test
    import: optional:classpath:application-reflex.yml
  sql:
    init:
      mode: never

app:
  metrics-datasources:
    business:
      url: jdbc:h2:mem:sample-metrics-test;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DATABASE_TO_LOWER=TRUE
      driver-class-name: org.h2.Driver
      username: sa
      password:
      hikari:
        pool-name: business-metrics-test-pool
        maximum-pool-size: 1
        minimum-idle: 0
        connection-timeout: 2000            # 2 с
        read-only: false
    workflow:
      url: jdbc:h2:mem:sample-metrics-test;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DATABASE_TO_LOWER=TRUE
      driver-class-name: org.h2.Driver
      username: sa
      password:
      hikari:
        pool-name: workflow-metrics-test-pool
        maximum-pool-size: 1
        minimum-idle: 0
        connection-timeout: 2000            # 2 с
        read-only: false
    telemetry:
      url: jdbc:h2:mem:sample-metrics-test;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DATABASE_TO_LOWER=TRUE
      driver-class-name: org.h2.Driver
      username: sa
      password:
      hikari:
        pool-name: telemetry-test-pool
        maximum-pool-size: 1
        minimum-idle: 0
        connection-timeout: 2000            # 2 с
        read-only: false

reflex:
  telemetry:
    enabled: true
    otlp:
      endpoint: http://127.0.0.1:9
    metrics:
      enabled: true
      jdbc:
        enabled: true
      export-interval: 1h
      definitions:
        documents-by-status:
          schedule:
            initial-delay: PT0S
            fixed-delay: PT1H
        payments-by-state:
          schedule:
            initial-delay: PT0S
            fixed-delay: PT1H
