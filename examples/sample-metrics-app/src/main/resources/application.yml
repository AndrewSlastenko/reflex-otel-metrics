spring:
  application:
    name: sample-metrics-app
  profiles:
    # Демо по умолчанию на in-memory H2. В деплое переопределить, напр. SPRING_PROFILES_ACTIVE=prod.
    default: local
  config:
    import: optional:classpath:application-reflex.yml
  sql:
    init:
      mode: never

app:
  metrics-lock:
    schema: telemetry
